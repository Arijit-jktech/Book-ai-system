version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/bookdb
      JWT_SECRET_KEY: "supersecret_local_change_me"
      LLAMA_ENDPOINT: "http://host.docker.internal:11434/run"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  db_data:
